name: Tests MVP
on:
  push:
    branches:
      - 'dev/post-mvp-audit-2026-10-19'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/mvp-smoke.mjs
