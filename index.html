function directoryStatus(p){
 const general=status(p.id);
 if(general==='Absent')return 'Absent';
 const missions=p.missions.map((_,i)=>missionStatus(p.id,i));
 if(general==='Sur poste'||missions.includes('Sur poste'))return 'Sur poste';
 if(general==='Accueil'||missions.includes('Accueil'))return 'Accueil';
 return 'Attendu';
}

function normName(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]/g,'').toUpperCase()}
// Correspondance insensible à l'ordre prénom/nom : 'CLOQUIÉ Maxime' = 'Jeanne Lehair'.
function personKey(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim().split(/\s+/).filter(Boolean).sort().join('|')}
// Fiches de rôle issues du registre 2025, sans affectation bénévole inventée.
for(const r of RESPONSIBLES){if(!DATA.people.some(p=>personKey(p.name)===personKey(r.name))){DATA.people.push({id:'R'+DATA.people.length,name:r.name,sources:[],missions:[]})}}
function responsibleOf(p){return RESPONSIBLES.find(r=>personKey(r.name)===personKey(p.name))||null}
function isLeaderOf(p,sector){let r=responsibleOf(p);return !!r&&r.role==='responsable'&&r.sectors.includes(sector)}
function isOperationalVolunteer(p){
 // Exclure toute personne classée comme responsable dans les archives,
 // même si sa fiche ne correspond pas encore au registre nominatif.
 return !!p && !responsibleOf(p) && !p.missions.some(m=>normName(m.sector)==='RESPONSABLES');
}
function volunteerPeople(){return DATA.people.filter(p=>isOperationalVolunteer(p)&&p.missions.length)}
function ensureVolunteerSelection(){let eligible=volunteerPeople();if(!eligible.some(p=>p.id===volunteerId))volunteerId=eligible.length?eligible[0].id:null}
function sectorLeader(sector){return RESPONSIBLES.filter(r=>r.role==='responsable'&&r.sectors.includes(sector))}
function leaderHeader(sector){let owners=sectorLeader(sector);return `<div class="leader-card"><strong>🟡 Responsable(s) — ${esc(sector)}</strong><div>${owners.length?owners.map(r=>esc(r.name)).join(' · '):'<span class="small">Non identifié dans le registre 2025</span>'}</div></div>`}
function scopedStatus(sector){let people=DATA.people.filter(p=>p.missions.some(m=>m.sector===sector)&&isOperationalVolunteer(p));let values=people.map(p=>{if(status(p.id)==='Absent')return 'Absent';let ix=p.missions.map((m,i)=>m.sector===sector?i:-1).filter(i=>i>=0);if(ix.some(i=>missionStatus(p.id,i)==='Sur poste'))return 'Sur poste';if(status(p.id)==='Accueil')return 'Accueil';return 'Attendu'});return `<div class="kpis"><div class="kpi"><b>${people.length}</b><span>Bénévoles affectés</span></div><div class="kpi"><b>${values.filter(v=>v==='Sur poste').length}</b><span>Sur poste</span></div><div class="kpi"><b>${values.filter(v=>v==='Accueil').length}</b><span>À l’accueil</span></div><div class="kpi"><b>${values.filter(v=>v==='Absent').length}</b><span>Absents</span></div><div class="kpi"><b>${values.filter(v=>v==='Attendu').length}</b><span>Attendus</span></div><div class="kpi"><b>${state.requests.filter(r=>r.sector===sector&&r.status==='Ouvert').length}</b><span>Renforts ouverts</span></div></div>`}

const ATHLETE_PHOTO_FILES = {"Alex Yee": "Paris2024 - Triathlon - 19 - Alex Yee.jpg", "Cassandre Beaugrand": "Cassandre Beaugrand au Parc des Champions pendant les JO 2024.jpg"};
function v24Info(name){return {flag:ATHLETE_FLAGS[name]||'🏳️',series:''};}
function v24Avatar(name){
 const file=ATHLETE_PHOTO_FILES[name];
 if(file)return 'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(file)+'?width=120';
 return v24FallbackAvatar(name);
}
function v24FallbackAvatar(name){
 const initials=name.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="88" height="88" viewBox="0 0 88 88"><circle cx="44" cy="44" r="44" fill="#38332a"/><text x="44" y="55" font-family="Arial" font-weight="bold" font-size="26" text-anchor="middle" fill="#f2dc03">${initials}</text></svg>`;
 return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function personRow(p,buttons=false){
 const r=responsibleOf(p);
 const info=v24Info(p.name);
 const badge=r?`<span class="tag role-tag">${r.role==='bureau'?'🔷 Bureau bénévoles':'🟡 Responsable · '+esc(r.responsibility)}</span>`:'';
 const stat=({'Attendu':'🟠 Attendu','Accueil':'🔵 Arrivé accueil','Sur poste':'🟢 Sur poste','Absent':'🔴 Absent'})[directoryStatus(p)]||'Statut non renseigné';
 return `<div class="row volunteer-line"><div class="v24-identity"><img class="v24-avatar" src="${v24Avatar(p.name)}" onerror="this.onerror=null;this.src=v24FallbackAvatar(this.dataset.athlete)" data-athlete="${esc(p.name)}" alt="Avatar de ${esc(p.name)}"><div class="volunteer-line-info"><div class="v24-name"><button type="button" class="click" onclick="showPerson('${p.id}')">${esc(p.name)}</button>${info.flag?`<span class="v24-flag" aria-label="Drapeau national">${info.flag}</span>`:''}</div>${badge}<small>${esc(mission(p))}</small></div></div><div class="volunteer-line-side"><span class="tag">${stat}</span>${buttons?`<button class="btn" onclick="change('${p.id}')">Gérer</button>`:''}</div></div>`;
}
function showPerson(id){let p=DATA.people.find(p=>p.id===id);if(!p)return;let r=responsibleOf(p);$('dlgtitle').textContent=p.name;$('dlgbody').innerHTML=`${r?`<p><span class="tag">${r.role==='bureau'?'🔷 Bureau de gestion des bénévoles':'🟡 Responsable · '+esc(r.responsibility)}</span></p>${r.sectors.length?`<p>Secteurs : ${r.sectors.map(esc).join(' · ')}</p>`:''}`:''}<p><span class="tag">${label(id)}</span></p><h3>Affectations</h3>${p.missions.length?p.missions.map(m=>`<div class="mission"><div><strong>${esc(m.sector)} — ${esc(m.post)}</strong><small>${esc(m.time||'Horaire non renseigné')}</small></div></div>`).join(''):'<p>Aucune affectation renseignée.</p>'}<h3>Inscriptions</h3>${p.sources.length?p.sources.map(s=>`<p>${esc(s.listing)} · ${esc(s.post)}</p>`).join(''):'<p>Aucune inscription renseignée.</p>'}`;$('dialog').showModal()}
function change(id){let p=DATA.people.find(p=>p.id===id);$('dlgtitle').textContent='Gérer : '+p.name;$('dlgbody').innerHTML=`<p>Changer le statut du bénévole :</p><div class="actiongrid">${['Attendu','Accueil','Sur poste','Absent'].map(s=>`<button class="btn" onclick="setStatus('${id}','${s}');$('dialog').close()">${esc(s)}</button>`).join('')}</div>`;$('dialog').showModal()}
function card(title,body,cls='full'){return `<section class="card ${cls}"><h2>${title}</h2>${body}</section>`}
function stats(){return `<div class="kpis"><div class="kpi"><b>${DATA.people.length}</b><span>Personnes</span></div><div class="kpi"><b>${DATA.posts.length}</b><span>Postes</span></div><div class="kpi"><b>${DATA.people.reduce((n,p)=>n+p.missions.length,0)}</b><span>Affectations</span></div><div class="kpi"><b>${Object.values(state.status).filter(s=>s==='Sur poste').length+Object.values(state.missionStatus).filter(s=>s==='Sur poste').length}</b><span>Sur poste</span></div><div class="kpi"><b>${Object.values(state.status).filter(s=>s==='Absent').length}</b><span>Absences</span></div><div class="kpi"><b>${state.requests.filter(x=>x.status==='Ouvert').length}</b><span>Renforts en attente</span></div></div>`}
function options(selected,all=false){return `<option value="">${all?'Tous les secteurs':'Choisir un secteur'}</option>`+DATA.areas.map(a=>`<option value="${esc(a)}" ${a===selected?'selected':''}>${esc(a)}</option>`).join('')}
function peopleScreen(isLeader=false){
 let scope=isLeader?leaderArea:area;
 let matches=DATA.people.filter(p=>(!isLeader||isOperationalVolunteer(p))&&(!scope||p.missions.some(m=>m.sector===scope)||!!(responsibleOf(p)&&responsibleOf(p).sectors.includes(scope)))
   &&(!filter||[p.name,mission(p)].join(' ').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().includes(filter.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()))
   &&(!directoryStatusFilter||directoryStatus(p)===directoryStatusFilter));
 let statusChoices=[['','Tous les statuts'],['Accueil','Arrivé à l’accueil'],['Sur poste','Sur poste'],['Absent','Absent'],['Attendu','Attendu']];
 return card(isLeader?'👥 Équipe — '+esc(leaderArea):'👥 Annuaire général',
 `<div class="filter"><input class="field" id="query" placeholder="Rechercher un nom, un poste..." value="${esc(filter)}" oninput="filter=this.value;limit=10;leaderLimit=10;render()"><select class="field select" onchange="${isLeader?'leaderArea':'area'}=this.value;limit=10;leaderLimit=10;render()">${options(scope,!isLeader)}</select><select class="field select" aria-label="Filtrer par statut" onchange="directoryStatusFilter=this.value;limit=10;leaderLimit=10;render()">${statusChoices.map(([value,title])=>`<option value="${value}" ${directoryStatusFilter===value?'selected':''}>${title}</option>`).join('')}</select></div><p class="small">${matches.length} personne(s) trouvée(s)</p><div class="list">${isLeader?leaderHeader(leaderArea):''}${matches.map(p=>personRow(p,true)).join('')||'<p>Aucun résultat pour ces filtres.</p>'}</div>`)
}
// Regroupement par secteur générique : les sous-postes 2025 restent dans les données sources,
// mais ne sont plus des entités distinctes dans l'interface de gestion.
const sectorPage={};
function sectorPeople(sector){return DATA.people.filter(p=>p.missions.some(m=>m.sector===sector)&&isOperationalVolunteer(p))}
function sectorMembers(sector){let members=sectorPeople(sector);return `<p class="sector-count">${members.length} bénévole(s)</p>${leaderHeader(sector)}<div class="sector-scroll">${members.map(p=>personRow(p)).join('')||'<p>Aucun bénévole pour ce secteur.</p>'}</div>`;}

function postsScreen(){let sectors=DATA.areas.filter(a=>(!area||a===area)&&(!filter||a.toLowerCase().includes(filter.toLowerCase())));return card('📍 Postes et secteurs',`<div class="filter"><input class="field" value="${esc(filter)}" placeholder="Chercher un secteur..." oninput="filter=this.value;render()"><select class="field" onchange="area=this.value;render()">${options(area,true)}</select></div><p class="small">${sectors.length} secteurs</p><div class="list">${sectors.map(a=>`<details class="sector-card"><summary>${esc(a)} <span class="tag">${sectorPeople(a).length} bénévole(s)</span></summary>${sectorMembers(a)}</details>`).join('')||'<p>Aucun secteur.</p>'}</div>`)}
function requests(){return card('🆘 Demandes de renfort',`<p class="small"></p>${state.requests.map((r,i)=>`<div class="mission"><div><strong>${esc(r.sector)} · ${r.qty} personne(s)</strong><small>${esc(r.reason)} · ${esc(r.status)}</small></div>${role==='admin'&&r.status==='Ouvert'?`<button class="btn" onclick="state.requests[${i}].status='Prise en charge';log('Renfort','Demande prise en charge')">Prendre en charge</button>`:''}</div>`).join('')||'<p>Aucune demande.</p>'}${role==='leader'?`<label class="label">Nombre</label><input type="number" min="1" max="30" id="qty" value="1" class="field"><label class="label">Motif</label><textarea id="reason" class="field"></textarea><button class="btn primary" onclick="request()">Envoyer la demande</button>`:''}`)}
function request(){let qty=Number($('qty').value),reason=$('reason').value.trim();if(!Number.isInteger(qty)||qty<1||qty>30||reason.length<5){alert('Indiquer un nombre valide et un motif d’au moins 5 caractères');return}state.requests.unshift({sector:leaderArea,qty,reason,status:'Ouvert'});log('Renfort',leaderArea+' · '+qty)}
function incidents(){return card('⚠️ Incidents',`${state.incidents.map((i,n)=>`<div class="mission"><div><strong>${esc(i.sector)}</strong><small>${esc(i.text)} · ${esc(i.status)}</small></div>${role==='admin'&&i.status==='Ouvert'?`<button class="btn" onclick="state.incidents[${n}].status='Clôturé';log('Incident','Clôturé')">Clôturer</button>`:''}</div>`).join('')||'<p>Aucun incident.</p>'}${role==='leader'?`<textarea class="field" id="incident" placeholder="Décrire l'incident (sans donnée médicale)"></textarea><button class="btn primary" onclick="incident()">Signaler</button>`:''}`)}
function incident(){let t=$('incident').value.trim();if(t.length<8){alert('Préciser les faits');return}state.incidents.unshift({sector:leaderArea,text:t,status:'Ouvert'});log('Incident',leaderArea+' · '+t)}
function materials(){return card('📦 Matériel',state.material.map((m,i)=>`<div class="row"><div><strong>${esc(m.name)}</strong><small>${m.total-m.out} disponible(s) · ${m.out} sorti(s)</small></div><div class="actions"><button class="btn" onclick="move(${i},1)">Prêter</button><button class="btn" onclick="move(${i},-1)">Retour</button></div></div>`).join(''))}
function move(i,d){let m=state.material[i];if(m.out+d<0||m.out+d>m.total){alert('Quantité impossible');return}m.out+=d;log('Matériel',m.name+(d>0?' prêt':' rendu'))}
function docRows(sector,editable){let docs=state.sectorDocs[sector]||[];return docs.length?docs.map((d,i)=>`<div class="row"><div><strong>📎 ${esc(d.name)}</strong><small>${Math.round(d.size/1024)} Ko · ${esc(sector)}</small></div><div class="actions"><button class="btn" onclick="downloadSectorDoc('${encodeURIComponent(sector)}',${i})">⬇ Télécharger</button>${editable?`<button class="btn" onclick="removeSectorDoc('${encodeURIComponent(sector)}',${i})">Supprimer</button>`:''}</div></div>`).join(''):'<p class="small">Aucun document associé à ce secteur.</p>'}
function downloadSectorDoc(encoded,i){let d=(state.sectorDocs[decodeURIComponent(encoded)]||[])[i];if(!d)return;let a=document.createElement('a');a.href=d.data;a.download=d.name;document.body.appendChild(a);a.click();a.remove()}
function removeSectorDoc(encoded,i){let sector=decodeURIComponent(encoded);if(!confirm('Supprimer ce document des consignes du secteur ?'))return;(state.sectorDocs[sector]||[]).splice(i,1);log('Document retiré',sector)}
function addSectorDoc(){let f=$('sector-doc-file').files[0],sector=$('sector-doc-area').value;if(!f){alert('Sélectionner un document.');return}if(f.size>1024*1024){alert('Le document doit faire au maximum 1 Mo.');return}let r=new FileReader();r.onload=()=>{let doc={name:f.name,size:f.size,type:f.type,data:r.result};(state.sectorDocs[sector]||(state.sectorDocs[sector]=[])).push(doc);try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){state.sectorDocs[sector].pop();alert('Espace de stockage du navigateur insuffisant. Choisir un fichier plus petit.');return}log('Document ajouté',sector+' · '+f.name)};r.onerror=()=>alert('Lecture du fichier impossible.');r.readAsDataURL(f)}

function volunteerSectorDocs(){ensureVolunteerSelection();let p=DATA.people.find(p=>p.id===volunteerId);if(!p)return '';let sectors=[...new Set(p.missions.map(m=>m.sector))];return card('📋 Consignes et documents de mes secteurs',sectors.map(a=>`<h3>${esc(a)}</h3>${state.instructions[a]?`<p>${esc(state.instructions[a])}</p>`:''}${docRows(a,false)}`).join('')||'<p>Aucune mission.</p>')}

function missionChronology(m){
 const t=String(m.time||'');
 let day=1;
 if(/vendredi/i.test(m.sector+' '+t))day=0;
 else if(/dimanche/i.test(m.sector+' '+t))day=2;
 const x=t.match(/(?:à partir de\s*|Convoc\s*:\s*|·\s*|^)(\d{1,2})\s*h\s*(\d{2})?/i);
 return day*1440+(x?Number(x[1])*60+Number(x[2]||0):1439);
}
function sortedMissions(p){return p.missions.map((m,i)=>({m,i})).sort((a,b)=>missionChronology(a.m)-missionChronology(b.m)||a.i-b.i)}
function simpleMissionName(m){return m.post&&m.post!==m.sector?m.sector+' — '+m.post:m.sector}

function volunteer(){
 ensureVolunteerSelection();
 let p=DATA.people.find(p=>p.id===volunteerId);
 if(!p)return card('📱 Mes missions','<p>Aucun bénévole opérationnel identifié.</p>');
 const ordered=sortedMissions(p);
 return card('📱 Mes missions',`<label class="label">Choisir un bénévole</label><select class="field" onchange="volunteerId=this.value;render()">${volunteerPeople().map(x=>`<option value="${x.id}" ${x.id===volunteerId?'selected':''}>${esc(x.name)}</option>`).join('')}</select><h2>${esc(p.name)}</h2>${ordered.map(({m,i},displayIndex)=>`<div class="mission"><div style="width:100%"><strong>${esc(simpleMissionName(m))}</strong><small>${esc(m.simulatedTime?'Horaire à confirmer':(m.time||'Horaire non renseigné'))}</small><p><span class="tag">${missionLabel(p.id,i)}</span></p><div class="mission-actions">${missionStatus(p.id,i)==='Sur poste'?`<button class="btn" onclick="setMissionStatus('${p.id}',${i},'Attendu')">↶ Annuler ma confirmation</button>`:`<button class="btn primary" onclick="setMissionStatus('${p.id}',${i},'Sur poste')">📍 Je suis à mon poste</button>`}</div></div></div>`).join('')}`);
}

let newsDraftAudience='all';
function newsViewerKey(){return role==='admin'?'admin':role==='leader'?'leader:'+leaderArea:'volunteer:'+volunteerId}
function newsVisible(n){if(n.deleted)return false;if(role==='admin')return true;if(n.audience==='all')return true;if(n.audience==='leaders')return role==='leader';if(n.audience==='sector'){if(role==='leader')return n.sector===leaderArea;let p=DATA.people.find(p=>p.id===volunteerId);return role==='volunteer'&&!!p&&p.missions.some(m=>m.sector===n.sector)}return false}
function unreadNews(){let last=state.newsSeen[newsViewerKey()]||'';return state.news.filter(n=>newsVisible(n)&&n.updatedAt>last).length}
function newsScreen(){let visible=state.news.filter(newsVisible).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||b.updatedAt.localeCompare(a.updatedAt));let form=role==='admin'?card('✍️ Publier une information',`<label class="label" for="news-title">Titre</label><input class="field" id="news-title" maxlength="100" placeholder="Ex. Départ retardé"><label class="label" for="news-body">Message</label><textarea class="field" id="news-body" maxlength="1500" placeholder="Information à communiquer..."></textarea><label class="label" for="news-audience">Destinataires</label><select class="field" id="news-audience" onchange="document.getElementById('news-sector-wrap').hidden=this.value!=='sector'"><option value="all">Tous les bénévoles et responsables</option><option value="leaders">Responsables uniquement</option><option value="sector">Un secteur uniquement</option></select><div id="news-sector-wrap" hidden><label class="label" for="news-sector">Secteur concerné</label><select class="field" id="news-sector">${options('')}</select></div><label class="label" for="news-priority">Priorité</label><select class="field" id="news-priority"><option value="normal">Normale</option><option value="important">Importante</option><option value="urgent">Urgente</option></select><label class="label"><input type="checkbox" id="news-pinned"> Épingler en tête du fil</label><p><button class="btn primary" onclick="publishNews()">📢 Publier</button></p>`):'';
return form+card('📢 Fil des infos course',`<p class="small">${visible.length} publication(s)</p>${visible.map(n=>`<article class="news-item ${n.priority==='urgent'?'news-urgent':''}"><div class="actions"><span class="chip ${n.priority==='urgent'?'red':n.priority==='important'?'orange':'blue'}">${n.priority==='urgent'?'🚨 Urgent':n.priority==='important'?'⚠️ Important':'ℹ️ Information'}</span>${n.pinned?'<span class="chip">📌 Épinglé</span>':''}<span class="chip">${esc(n.audience==='all'?'Tout le monde':n.audience==='leaders'?'Responsables':n.sector)}</span></div><h3>${esc(n.title)}</h3><p class="news-text">${esc(n.body)}</p><small class="small">${esc(n.updatedAtDisplay)}${n.edited?' · modifié':''}</small>${role==='admin'?`<div class="actions" style="margin-top:12px"><button class="btn" onclick="editNews('${n.id}')">Modifier</button><button class="btn" onclick="toggleNewsPin('${n.id}')">${n.pinned?'Désépingler':'Épingler'}</button><button class="btn danger" onclick="deleteNews('${n.id}')">Retirer</button></div>`:''}</article>`).join('')||'<p>Aucune information publiée pour le moment.</p>'}`)}
function publishNews(){if(role!=='admin')return;let title=$('news-title').value.trim(),body=$('news-body').value.trim(),audience=$('news-audience').value,sector=$('news-sector').value,priority=$('news-priority').value,pinned=$('news-pinned').checked;if(!title||body.length<5){alert('Saisir un titre et un message d’au moins 5 caractères.');return}if(audience==='sector'&&!sector){alert('Choisir un secteur.');return}let now=new Date(),id='n'+now.getTime()+'-'+Math.random().toString(36).slice(2,7);state.news.unshift({id,title,body,audience,sector:audience==='sector'?sector:'',priority,pinned,deleted:false,edited:false,updatedAt:now.toISOString(),updatedAtDisplay:now.toLocaleString('fr-FR')});log('Infos course','Publication : '+title)}
function editNews(id){if(role!=='admin')return;let n=state.news.find(x=>x.id===id);if(!n||n.deleted)return;let title=prompt('Titre de la publication',n.title);if(title===null)return;let body=prompt('Texte de la publication',n.body);if(body===null)return;if(!title.trim()||body.trim().length<5){alert('Titre et texte requis.');return}n.title=title.trim().slice(0,100);n.body=body.trim().slice(0,1500);n.edited=true;touchNews(n);log('Infos course','Modification : '+n.title)}
function touchNews(n){let d=new Date();n.updatedAt=d.toISOString();n.updatedAtDisplay=d.toLocaleString('fr-FR')}
function toggleNewsPin(id){if(role!=='admin')return;let n=state.news.find(x=>x.id===id);if(!n||n.deleted)return;n.pinned=!n.pinned;touchNews(n);log('Infos course',(n.pinned?'Épinglage : ':'Désépinglage : ')+n.title)}
function deleteNews(id){if(role!=='admin')return;let n=state.news.find(x=>x.id===id);if(!n||n.deleted)return;if(!confirm('Retirer cette publication du fil ?'))return;n.deleted=true;touchNews(n);log('Infos course','Retrait : '+n.title)}

function render(){document.getElementById('admin-settings').hidden=role!=='admin';ensureVolunteerSelection();let titles={admin:'Bureau central',leader:'Responsable de secteur',volunteer:'Espace bénévole'};$('title').textContent=titles[role];$('eyebrow').textContent=role==='admin'?'PILOTAGE':role==='leader'?'GESTION DE SECTEUR':'MES MISSIONS';let tabs=role==='admin'?[['home','📊 Tableau'],['news','📢 Infos course'],['team','👥 Équipes'],['posts','📍 Postes'],['welcome','🏁 Accueil'],['requests','🆘 Renforts'],['material','📦 Matériel'],['incidents','⚠️ Incidents'],['history','🕒 Journal'],['docs','📋 Consignes']]:role==='leader'?[['home','🏠 Poste'],['team','👥 Équipe'],['requests','➕ Renfort'],['incidents','⚠️ Incident'],['instructions','📋 Consignes'],['news','📢 Infos course']]:[['home','🏠 Missions'],['team','👥 Équipe'],['info','ℹ️ Infos'],['news','📢 Infos course']];if(!tabs.some(x=>x[0]===tab))tab='home';$('nav').innerHTML=tabs.map(([k,l])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';filter='';render()">${l}${k==='news'&&unreadNews()?` <span class='news-badge'>${unreadNews()}</span>`:''}</button>`).join('');let screens=role==='admin'?{home:()=>card('📊 Vue d’ensemble',stats())+card('🔎 Accès rapides',`<div class="actiongrid"><button class="btn primary" onclick="tab='news';render()">📢 Publier une info course</button><button class="btn" onclick="tab='team';render()">Annuaire complet</button><button class="btn" onclick="tab='posts';render()">Secteurs génériques 2025</button></div>`),team:()=>peopleScreen(),posts:postsScreen,welcome:welcome,requests:requests,material:materials,incidents:incidents,history:history,news:newsScreen,docs:adminSectorDocs}:role==='leader'?{home:()=>card('🏠 Secteur du responsable',`<select class="field" onchange="leaderArea=this.value;render()">${options(leaderArea)}</select><p>Suivez les présences, les absences et les besoins de votre secteur.</p><p class='small'>Responsabilités à confirmer pour l’événement.</p>`)+card('📊 État du secteur',leaderArea?leaderHeader(leaderArea)+scopedStatus(leaderArea)+`<p><button class="btn ${state.leaderCheckins?.[leaderArea]?'success':'primary'}" onclick="leaderCheckIn(leaderArea)">${state.leaderCheckins?.[leaderArea]?'✓ Prise de poste responsable confirmée · Annuler':'📍 Je prends mon poste de responsable'}</button></p>`:'<p>Choisir un secteur.</p>'),team:()=>peopleScreen(true),requests:requests,incidents:incidents,instructions:instructions,news:newsScreen}:{home:volunteer,team:()=>{let p=DATA.people.find(p=>p.id===volunteerId);return card('👥 Équipe du bénévole',`<div class="v22-scroll">${DATA.people.filter(x=>isOperationalVolunteer(x)&&x.id!==p.id&&x.missions.some(m=>p.missions.some(n=>n.sector===m.sector))).map(x=>personRow(x)).join('')||'<p>Aucun collègue identifié.</p>'}</div>`)},info:()=>card('ℹ️ Informations','<p>Consignes et documents associés aux missions.</p>')+volunteerSectorDocs(),news:newsScreen};$('content').innerHTML=screens[tab]();if(tab==='news'){state.newsSeen[newsViewerKey()]=new Date().toISOString()}persist()}
function reset(){state={status:{},missionStatus:{},requests:[],incidents:[],history:[],instructions:{},news:[],newsSeen:{},sectorDocs:{},leaderCheckins:{},material:[{id:'M1',name:'Radios',total:8,out:0},{id:'M2',name:'Gilets',total:20,out:0}]};try{localStorage.removeItem(KEY)}catch(e){};persist();render();$('saved').textContent='✓ Opérations réinitialisées'}
function exportState(){
  try{
    const key='chamberienne_v17_copie_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
    const snapshot={key,state:JSON.parse(JSON.stringify(state)),phones:eventPhones()};
    const bytes=new TextEncoder().encode(JSON.stringify(snapshot));
    let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
    const encoded=btoa(binary);
    const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML.replace(/window\.__V17_SNAPSHOT_B64__='[^']*'/,"window.__V17_SNAPSHOT_B64__='"+encoded+"'");
    const blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='Chamberienne_2026_Export_'+new Date().toISOString().slice(0,10)+'.html';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
    $('saved').textContent='✓ Copie HTML complète enregistrée (données et documents inclus)';
  }catch(e){alert('Export HTML impossible : '+e.message)}
}
